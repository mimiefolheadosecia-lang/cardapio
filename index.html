<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Churros & Cia Aracaju</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fdf6e7;
      color: #4a2508;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #5c2d0c;
      color: #fff;
      text-align: center;
      padding: 20px 15px;
    }
    header h1 {
      margin: 5px 0;
      font-size: 24px;
    }
    header p {
      margin: 5px 0 0;
      font-size: 14px;
      color: #f7d9a8;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 15px;
    }
    h2 {
      font-size: 18px;
      border-bottom: 2px solid #e0a938;
      padding-bottom: 5px;
      margin-top: 25px;
    }
    .card {
      background: #fff;
      border: 1px solid #ead8b8;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .info h3 {
      margin: 0 0 4px;
      font-size: 16px;
    }
    .info p {
      margin: 0 0 6px;
      font-size: 13px;
      color: #6e4726;
    }
    .preco {
      font-weight: bold;
      color: #c25900;
      font-size: 15px;
    }
    .subtotal-item {
      font-size: 13px;
      color: #1e7e34;
      font-weight: bold;
      margin-top: 4px;
    }
    .controles {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-qtd {
      background-color: #f39c12;
      color: #fff;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-qtd:active {
      background-color: #d68910;
    }
    .qtd-valor {
      font-size: 18px;
      font-weight: bold;
      min-width: 20px;
      text-align: center;
    }
    .resumo-box {
      background: #fffdf8;
      border: 1px solid #d4b475;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin: 12px 0 5px;
      font-size: 14px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
    }
    .btn-whatsapp {
      display: block;
      width: 100%;
      background-color: #25d366;
      color: #fff;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
      padding: 15px;
      border: none;
      border-radius: 10px;
      margin-top: 20px;
      cursor: pointer;
    }
    .btn-whatsapp:hover {
      background-color: #1ebe5d;
    }
  </style>
</head>
<body>

<header>
  <h1>Churros & Cia Aracaju</h1>
  <p>Entrega: até 3 km R$ 2,50 • até 4 km R$ 4,00 (José Conrado de Araújo)</p>
</header>

<div class="container">

  <h2>🍩 Churros Tradicionais — R$ 6,00 cada</h2>
  <div id="lista-tradicionais"></div>

  <h2>⭐ Churros Especiais — R$ 8,00 cada</h2>
  <div id="lista-especiais"></div>

  <h2>🥤 Bebidas</h2>
  <div id="lista-bebidas"></div>

  <h2>📋 Finalizar Pedido</h2>
  <div class="resumo-box">
    <div id="resumo-itens">🛒 Nenhum item selecionado ainda.</div>
    <p style="margin: 10px 0 0; font-weight: bold;">Total do Pedido: R$ <span id="valor-total">0,00</span></p>
  </div>

  <label for="cliente-nome">Seu Nome *</label>
  <input type="text" id="cliente-nome" placeholder="Digite seu nome">

  <label for="cliente-zap">Seu WhatsApp (com DDD) *</label>
  <input type="tel" id="cliente-zap" placeholder="(79) 99999-9999">

  <label for="tipo-entrega">Entrega ou Retirada *</label>
  <select id="tipo-entrega" onchange="atualizarResumo()">
    <option value="0">Retirar no local (Grátis)</option>
    <option value="2.50">Entrega - Até 3 km (R$ 2,50)</option>
    <option value="4.00">Entrega - Até 4 km (R$ 4,00)</option>
  </select>

  <label for="cliente-endereco">Endereço (se for entrega)</label>
  <input type="text" id="cliente-endereco" placeholder="Rua, número, ponto de referência">

  <button type="button" class="btn-whatsapp" onclick="enviarWhatsApp()">
    📲 Enviar Pedido no WhatsApp
  </button>

</div>

<script>
  const produtos = [
    { id: 0, categoria: "tradicionais", nome: "Churros Doce de Leite", desc: "Recheio cremoso de doce de leite", preco: 6.00, qtd: 0 },
    { id: 1, categoria: "tradicionais", nome: "Churros Chocolate", desc: "Recheio cremoso de chocolate", preco: 6.00, qtd: 0 },
    { id: 2, categoria: "tradicionais", nome: "Churros Misto", desc: "Doce de leite e chocolate juntos", preco: 6.00, qtd: 0 },
    { id: 3, categoria: "especiais", nome: "Churros de Nutella", desc: "Creme de avelã Nutella original", preco: 8.00, qtd: 0 },
    { id: 4, categoria: "bebidas", nome: "Coca-Cola Lata", desc: "350ml bem gelada", preco: 6.00, qtd: 0 }
  ];

  function renderizarCardapio() {
    document.getElementById("lista-tradicionais").innerHTML = "";
    document.getElementById("lista-especiais").innerHTML = "";
    document.getElementById("lista-bebidas").innerHTML = "";

    produtos.forEach(prod => {
      const subtotal = (prod.qtd * prod.preco).toFixed(2).replace(".", ",");
      const precoFormatado = prod.preco.toFixed(2).replace(".", ",");

      const cardHTML = `
        <div class="card">
          <div class="info">
            <h3>${prod.nome}</h3>
            <p>${prod.desc}</p>
            <div class="preco">R$ ${precoFormatado}</div>
            <div class="subtotal-item">${prod.qtd} un. = R$ ${subtotal}</div>
          </div>
          <div class="controles">
            <button type="button" class="btn-qtd" onclick="alterarQtd(${prod.id}, -1)">-</button>
            <span class="qtd-valor">${prod.qtd}</span>
            <button type="button" class="btn-qtd" onclick="alterarQtd(${prod.id}, 1)">+</button>
          </div>
        </div>
      `;

      document.getElementById(`lista-${prod.categoria}`).innerHTML += cardHTML;
    });
  }

  function alterarQtd(id, delta) {
    const item = produtos.find(p => p.id === id);
    if (!item) return;
    item.qtd += delta;
    if (item.qtd < 0) item.qtd = 0;
    renderizarCardapio();
    atualizarResumo();
  }

  function atualizarResumo() {
    const selecionados = produtos.filter(p => p.qtd > 0);
    const resumoDiv = document.getElementById("resumo-itens");
    const taxaEntrega = parseFloat(document.getElementById("tipo-entrega").value);

    if (selecionados.length === 0) {
      resumoDiv.innerHTML = "🛒 Nenhum item selecionado ainda.";
      document.getElementById("valor-total").innerText = taxaEntrega.toFixed(2).replace(".", ",");
      return;
    }

    let somaProdutos = 0;
    let htmlItens = "";

    selecionados.forEach(p => {
      const sub = p.qtd * p.preco;
      somaProdutos += sub;
      htmlItens += `<div>• ${p.qtd}x ${p.nome} — R$ ${sub.toFixed(2).replace(".", ",")}</div>`;
    });

    const totalGeral = somaProdutos + taxaEntrega;
    resumoDiv.innerHTML = htmlItens;
    document.getElementById("valor-total").innerText = totalGeral.toFixed(2).replace(".", ",");
  }

  function enviarWhatsApp() {
    const selecionados = produtos.filter(p => p.qtd > 0);
    if (selecionados.length === 0) {
      alert("Selecione pelo menos 1 item antes de enviar o pedido.");
      return;
    }

    const nome = document.getElementById("cliente-nome").value.trim();
    const zapCliente = document.getElementById("cliente-zap").value.trim();
    const selectEntrega = document.getElementById("tipo-entrega");
    const taxaEntrega = parseFloat(selectEntrega.value);
    const textoEntrega = selectEntrega.options[selectEntrega.selectedIndex].text;
    const endereco = document.getElementById("cliente-endereco").value.trim();

    if (!nome || !zapCliente) {
      alert("Por favor, preencha seu Nome e WhatsApp.");
      return;
    }

    let mensagem = `*NOVO PEDIDO - CHURROS & CIA ARACAJU*\n\n`;
    mensagem += `*Cliente:* ${nome}\n`;
    mensagem += `*WhatsApp:* ${zapCliente}\n`;
    mensagem += `*Opção:* ${textoEntrega}\n`;
    if (endereco) mensagem += `*Endereço:* ${endereco}\n`;
    mensagem += `\n*Itens do Pedido:*\n`;

    let total = taxaEntrega;
    selecionados.forEach(p => {
      const sub = p.qtd * p.preco;
      total += sub;
      mensagem += `- ${p.qtd}x ${p.nome} (R$ ${sub.toFixed(2).replace(".", ",")})\n`;
    });

    mensagem += `\n*TOTAL A PAGAR: R$ ${total.toFixed(2).replace(".", ",")}*`;

    const numeroLoja = "5579991561236";
    const url = `https://wa.me{numeroLoja}?text=${encodeURIComponent(mensagem)}`;
    window.open(url, "_blank");
  }

  renderizarCardapio();
</script>

</body>
</html>
