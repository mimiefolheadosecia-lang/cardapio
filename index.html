<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cardápio • Churros & Cia Aracaju</title>
  <script src="https://cloudflare.com"></script>
  <style>
    body{background:#111;color:#fff;font-family:sans-serif;margin:0;padding:15px;padding-bottom:95px}
    .topo{text-align:center;margin-bottom:15px}
    h1{font-size:20px;color:#f5b014;margin:8px 0 2px}
    .sub{font-size:13px;color:#ccc}
    .sec{color:#f5b014;border-bottom:1px solid #333;padding-bottom:5px;margin:18px 0 10px;font-size:16px;font-weight:bold}
    .grupo-titulo{color:#f5b014;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin:14px 0 8px;opacity:0.9}
    .prod{background:#1e1e1e;padding:12px;border-radius:10px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;border:1px solid #2c2c2c}
    .preco{color:#2ecc71;font-weight:bold;font-size:15px}
    .qtd-box{display:flex;align-items:center;gap:10px}
    .btn-q{background:#f5b014;color:#111;border:none;width:30px;height:30px;border-radius:6px;font-weight:bold;font-size:18px;cursor:pointer}
    .box{background:#1e1e1e;padding:14px;border-radius:10px;border:1px solid #333;margin-top:15px}
    input,select,textarea{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #444;background:#2a2a2a;color:#fff;box-sizing:border-box;font-size:15px}
    .pix-box{background:#132a28;border:1px solid #00bdae;padding:12px;border-radius:10px;text-align:center;margin-top:10px}
    .btn-pix{background:#00bdae;color:#fff;border:none;padding:10px;border-radius:8px;font-weight:bold;width:100%;cursor:pointer;margin-top:5px}
    .barra-fixa{position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;padding:12px 15px;border-top:2px solid #f5b014;display:flex;justify-content:space-between;align-items:center;z-index:99}
    .btn-zap{background:#25d366;color:#111;border:none;padding:12px 18px;border-radius:8px;font-weight:bold;font-size:15px;cursor:pointer}
    .logo{width:130px;height:130px;border-radius:50%;border:3px solid #f5b014;object-fit:cover;box-shadow:0 4px 12px rgba(245,176,20,0.3)}
  </style>
</head>
<body>
  <div class="topo">
    <img src="BackgroundEraser_20261125_163319495.png" class="logo" alt="Logo Churros & Cia">
    <h1>CHURROS & CIA ARACAJU</h1>
    <div class="sub">Crocante por fora, explosão por dentro • Delivery até 4 km</div>
  </div>

  <div class="sec">🍩 Churros</div>
  <div id="lista_churros"></div>

  <div class="sec">🥤 Bebidas Geladas</div>
  <div id="lista_bebidas"></div>

  <div class="box">
    <strong style="color:#f5b014">👤 Seus Dados para Entrega e Registro</strong>
    <input type="text" id="cliente" placeholder="Seu Nome Completo *" required>
    <input type="tel" id="telefone" placeholder="Seu WhatsApp com DDD (ex: 79 99999-9999) *" required>
    <select id="bairro" onchange="atualizarTotal()">
      <option value="0" data-nome="">-- Selecione seu Bairro (Raio até 4 km) * --</option>
      <option value="0" data-nome="Retirar no Local (José Conrado de Araújo)">Retirar no Local (José Conrado de Araújo) - Grátis</option>
      <option value="2.00" data-nome="José Conrado de Araújo">José Conrado de Araújo - Frete R$ 2,00</option>
      <option value="2.00" data-nome="Novo Paraíso / América / Santos Dumont">Novo Paraíso / América / Santos Dumont - Frete R$ 2,00</option>
      <option value="2.00" data-nome="Capucho / Olaria">Capucho / Olaria - Frete R$ 2,00</option>
      <option value="4.00" data-nome="Siqueira Campos / Getúlio Vargas / Cirurgia">Siqueira Campos / Getúlio Vargas / Cirurgia - Frete R$ 4,00</option>
      <option value="4.00" data-nome="Centro / Santo Antônio / Palestina">Centro / Santo Antônio / Palestina - Frete R$ 4,00</option>
      <option value="4.00" data-nome="Cidade Nova / Jardim Centenário / Ponto Novo">Cidade Nova / Jardim Centenário / Ponto Novo - Frete R$ 4,00</option>
    </select>
    <input type="text" id="endereco" placeholder="Rua, Número e Ponto de Referência *">
    <select id="pagamento" onchange="atualizarTotal()">
      <option value="Pix">💳 Pagamento: Pix (QR Code / Copia e Cola)</option>
      <option value="Cartão de Crédito (Maquininha)">💳 Pagamento: Cartão de Crédito</option>
      <option value="Cartão de Débito (Maquininha)">💳 Pagamento: Cartão de Débito</option>
      <option value="Dinheiro">💵 Pagamento: Dinheiro</option>
    </select>

    <div id="area_pix" class="pix-box">
      <strong style="color:#00bdae">📱 Pague agora via Pix</strong><br>
      <small style="color:#ccc">Chave Aleatória: <b>fdb4a231-98d9-436c-8ae8-bb402e545b87</b></small><br>
      <div id="qr_box" style="display:inline-block;background:#fff;padding:8px;border-radius:8px;margin:8px 0"></div>
      <textarea id="pix_copia" rows="2" readonly style="font-size:11px"></textarea>
      <button type="button" class="btn-pix" onclick="copiarPix(this)">📋 Copiar Pix Copia e Cola</button>
    </div>
  </div>

  <div class="barra-fixa">
    <div><small style="color:#ccc">Total com Frete:</small><br><strong id="total_txt" style="color:#2ecc71;font-size:18px">R$ 0,00</strong></div>
    <button type="button" id="btn_zap" onclick="enviarZap()" class="btn-zap">📲 Pedir no WhatsApp</button>
  </div>

  <script>
    // COLE ENTRE AS ASPAS ABAIXO A SUA URL DO GOOGLE APPS SCRIPT (TERMINADA EM /exec)
    const URL_SCRIPT = "COLE_SUA_URL_DO_GOOGLE_APPS_SCRIPT_AQUI";
    const ZAP_LOJA = "5579991561236";
    const PIX_CHAVE = "fdb4a231-98d9-436c-8ae8-bb402e545b87";
    const PIX_NOME = "CLAUDEMIR DOS SANTOS NICU";

    const PRODUTOS = [
      {id:1, cat:"churros", grupo:"Tradicional", nome:"Churros Doce de Leite", desc:"Recheio cremoso tradicional + açúcar e canela", preco:6.00},
      {id:2, cat:"churros", grupo:"Tradicional", nome:"Churros Chocolate", desc:"Recheio de chocolate + açúcar e canela", preco:6.00},
      {id:3, cat:"churros", grupo:"Tradicional", nome:"Churros Misto", desc:"Doce de leite e chocolate + açúcar e canela", preco:6.00},
      {id:4, cat:"churros", grupo:"Churros Premium", nome:"Churros Premium Nutella", desc:"Recheado com Nutella legítima", preco:8.00},
      {id:5, cat:"churros", grupo:"Churros Premium", nome:"Churros Premium Ninho", desc:"Recheio cremoso de Leite Ninho", preco:8.00},
      {id:6, cat:"churros", grupo:"Churros Premium", nome:"Churros Premium Ninho com Nutella", desc:"Combinação especial de Leite Ninho com Nutella", preco:8.00},
      {id:7, cat:"churros", grupo:"Churros Gourmet", nome:"Churros Gourmet com M&M's", desc:"Super recheado com cobertura e confeitos M&M's", preco:10.00},
      {id:8, cat:"bebidas", grupo:"", nome:"Água Mineral 500ml", desc:"Sem gás, bem gelada", preco:2.50},
      {id:9, cat:"bebidas", grupo:"", nome:"Coca-Cola Lata 350ml", desc:"Bem gelada", preco:5.00},
      {id:10, cat:"bebidas", grupo:"", nome:"Fanta Lata 350ml", desc:"Bem gelada", preco:5.00},
      {id:11, cat:"bebidas", grupo:"", nome:"Guaraná Lata 350ml", desc:"Bem gelado", preco:5.00}
    ];

    let carrinho = {};

    function campoPix(id, v){ 
      return id + String(v.length).padStart(2,'0') + v; 
    }

    function crc16(s){
      let c = 0xFFFF;
      for(let i=0; i<s.length; i++){
        c ^= (s.charCodeAt(i) << 8);
        for(let j=0; j<8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) : (c << 1);
        c &= 0xFFFF;
      }
      return c.toString(16).toUpperCase().padStart(4,'0');
    }

    function montarBRCode(valor){
      let mai = campoPix("00","br.gov.bcb.pix") + campoPix("01",PIX_CHAVE);
      let p = campoPix("00","01") + campoPix("26",mai) + campoPix("52","0000") + campoPix("53","986") + (valor>0 ? campoPix("54",valor.toFixed(2)) : "") + campoPix("58","BR") + campoPix("59",PIX_NOME) + campoPix("60","ARACAJU") + campoPix("62",campoPix("05","CHURROS")) + "6304";
      return p + crc16(p);
    }

    function render(){
      let hc="", hb="", grupoAtual="";
      PRODUTOS.forEach(p=>{
        if(p.cat=="churros" && p.grupo !== grupoAtual){
          grupoAtual = p.grupo;
          hc += `<div class="grupo-titulo">${grupoAtual}</div>`;
        }
        let q = carrinho[p.id]||0;
        let card = `<div class="prod"><div><strong>${p.nome}</strong><br><small style="color:#aaa">${p.desc}</small><br><span class="preco">R$ ${p.preco.toFixed(2).replace('.',',')}</span></div><div class="qtd-box"><button type="button" class="btn-q" onclick="mudar(${p.id},-1)">-</button><span>${q}</span><button type="button" class="btn-q" onclick="mudar(${p.id},1)">+</button></div></div>`;
        if(p.cat=="churros") hc+=card; else hb+=card;
      });
      document.getElementById("lista_churros").innerHTML = hc;
      document.getElementById("lista_bebidas").innerHTML = hb;
      atualizarTotal();
    }

    function mudar(id, delta){
      carrinho[id] = Math.max(0, (carrinho[id]||0) + delta);
      render();
    }

    function atualizarTotal(){
      let subtotal = 0;
      PRODUTOS.forEach(p => { subtotal += (carrinho[p.id]||0) * p.preco; });
      let frete = parseFloat(document.getElementById("bairro").value) || 0;
      let total = subtotal > 0 ? subtotal + frete : 0;
      
      document.getElementById("total_txt").innerText = "R$ " + total.toFixed(2).replace('.',',');

      const pag = document.getElementById("pagamento").value;
      const areaPix = document.getElementById("area_pix");
      if (pag === "Pix") {
        areaPix.style.display = "block";
        const brcode = montarBRCode(total);
        document.getElementById("pix_copia").value = brcode;
        const qrBox = document.getElementById("qr_box");
        qrBox.innerHTML = "";
        if (typeof QRCode !== "undefined") {
          new QRCode(qrBox, { text: brcode, width: 140, height: 140 });
        }
      } else {
        areaPix.style.display = "none";
      }
    }

    function copiarPix(btn){
      const campo = document.getElementById("pix_copia");
      campo.select();
